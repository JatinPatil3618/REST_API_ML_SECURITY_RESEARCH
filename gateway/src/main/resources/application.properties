server.port=8080
spring.application.name=security-gateway

# Targets
target.demo-api.url=http://localhost:5001
target.ml-service.url=http://localhost:8000
target.mongo.uri=mongodb://localhost:27017

# Security Engine Config
# production keeps the active 13-feature ATRDF models.
# experimental-payload / experimental-jndi are review forests.
# pattern-reinforcement scores ATRDF and BOLA with Sequential Pattern Reinforcement
# (Random Forest + historical family prototypes + /feedback updates).
gateway.atrdf.profile=production
gateway.confidence.threshold=0.70
gateway.bola.window-size=10
gateway.fail-safe.mode=ALERT
# After this many hard BLOCKs from the same source in the window, apply source_cooldown (HTTP 429).
gateway.mitigation.rate-limit.blocks=8
gateway.mitigation.rate-limit.window-seconds=120

# Logging
logging.level.com.apisecurity.gateway=INFO
logging.level.org.springframework.web=WARN

# Embedded Tomcat Attack Payload Inspection Support
server.tomcat.relaxed-query-chars=|,[,],{,},<,>,\\,^,`
server.tomcat.relaxed-path-chars=|,[,],{,},<,>,\\,^,`
