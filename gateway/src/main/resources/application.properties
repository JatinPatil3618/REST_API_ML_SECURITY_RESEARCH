server.port=8080
spring.application.name=security-gateway

# Targets
target.demo-api.url=http://localhost:5001
target.ml-service.url=http://localhost:8000
target.mongo.uri=mongodb://localhost:27017

# Security Engine Config
gateway.confidence.threshold=0.70
gateway.bola.window-size=10
gateway.fail-safe.mode=ALERT

# Logging
logging.level.com.apisecurity.gateway=INFO
logging.level.org.springframework.web=WARN

# Embedded Tomcat Attack Payload Inspection Support
server.tomcat.relaxed-query-chars=|,[,],{,},<,>,\\,^,`
server.tomcat.relaxed-path-chars=|,[,],{,},<,>,\\,^,`
