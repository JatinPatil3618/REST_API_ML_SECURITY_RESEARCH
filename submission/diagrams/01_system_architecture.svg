<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640">
  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="40" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">System architecture</text>
  <text x="40" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">Review path used for this submission. Production port 8080 is not on this path.</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">
    <rect x="40" y="90" width="200" height="72" rx="8" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="140" y="118" text-anchor="middle" font-weight="700">Book catalog</text>
    <text x="140" y="138" text-anchor="middle">127.0.0.1:4173</text>
    <rect x="40" y="210" width="200" height="72" rx="8" fill="#f8fafc" stroke="#334155"/>
    <text x="140" y="238" text-anchor="middle" font-weight="700">OWASP ZAP 2.17.0</text>
    <text x="140" y="258" text-anchor="middle">127.0.0.1:8091</text>
    <rect x="360" y="140" width="250" height="100" rx="8" fill="#ecfdf5" stroke="#047857"/>
    <text x="485" y="172" text-anchor="middle" font-weight="700">Review security gateway</text>
    <text x="485" y="194" text-anchor="middle">127.0.0.1:8081</text>
    <text x="485" y="214" text-anchor="middle">profile experimental-payload</text>
    <rect x="740" y="90" width="220" height="72" rx="8" fill="#fff7ed" stroke="#c2410c"/>
    <text x="850" y="118" text-anchor="middle" font-weight="700">ML service</text>
    <text x="850" y="138" text-anchor="middle">127.0.0.1:8000</text>
    <rect x="740" y="210" width="220" height="72" rx="8" fill="#fefce8" stroke="#a16207"/>
    <text x="850" y="238" text-anchor="middle" font-weight="700">Demo API</text>
    <text x="850" y="258" text-anchor="middle">127.0.0.1:5001</text>
    <rect x="360" y="320" width="250" height="72" rx="8" fill="#f1f5f9" stroke="#475569"/>
    <text x="485" y="348" text-anchor="middle" font-weight="700">Gateway telemetry</text>
    <text x="485" y="368" text-anchor="middle">/api/telemetry/events</text>
    <rect x="740" y="320" width="220" height="72" rx="8" fill="#f8fafc" stroke="#64748b"/>
    <text x="850" y="348" text-anchor="middle" font-weight="700">Research dashboard</text>
    <text x="850" y="368" text-anchor="middle">localhost:5174</text>
    <rect x="40" y="460" width="520" height="88" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
    <text x="300" y="494" text-anchor="middle" font-weight="700">Production gateway, not used by this catalog</text>
    <text x="300" y="516" text-anchor="middle">127.0.0.1:8080, original jar and models/atrdf, models/bola</text>
  </g>
  <g stroke="#111827" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
        <path d="M0,0 L8,3 L0,6 Z" fill="#111827"/>
      </marker>
    </defs>
    <line x1="240" y1="126" x2="360" y2="170"/>
    <line x1="240" y1="246" x2="360" y2="200"/>
    <line x1="610" y1="170" x2="740" y2="126"/>
    <line x1="610" y1="210" x2="740" y2="236"/>
    <line x1="485" y1="240" x2="485" y2="320"/>
    <line x1="610" y1="356" x2="740" y2="356"/>
  </g>
  <text x="270" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1d4ed8">catalog API</text>
  <text x="250" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">attack tests</text>
  <text x="640" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#c2410c">features</text>
  <text x="640" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a16207">allow or alert</text>
</svg>
