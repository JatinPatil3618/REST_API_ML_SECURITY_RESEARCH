<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460">
  <rect width="1100" height="460" fill="#ffffff"/>
  <text x="32" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">OWASP ZAP testing workflow</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827" text-anchor="middle">
    <rect x="40" y="70" width="240" height="90" rx="8" fill="#f8fafc" stroke="#334155"/>
    <text x="160" y="104" font-weight="700">ZAP 2.17.0</text>
    <text x="160" y="126">127.0.0.1:8091</text>
    <text x="160" y="146">API key disabled, loopback</text>
    <rect x="360" y="60" width="300" height="110" rx="8" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="510" y="96" font-weight="700">Passive spider</text>
    <text x="510" y="118">built catalog 127.0.0.1:4173</text>
    <text x="510" y="140">dev server 5173 recorded separately</text>
    <rect x="730" y="60" width="320" height="110" rx="8" fill="#fef2f2" stroke="#b91c1c"/>
    <text x="890" y="96" font-weight="700">Active tests and sendRequest</text>
    <text x="890" y="118">review gateway 127.0.0.1:8081 only</text>
    <text x="890" y="140">GET-only bounded scan; no OAST</text>
    <rect x="200" y="240" width="700" height="80" rx="8" fill="#ecfdf5" stroke="#047857"/>
    <text x="550" y="272" font-weight="700">Join ZAP message id to X-Request-Id</text>
    <text x="550" y="296">ML class, probability, rule id, gateway decision, HTTP status, backendReached</text>
    <rect x="120" y="360" width="860" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
    <text x="550" y="398">Port 8080, the demo API, and external hosts are outside the attack scope. No callback and no OS command.</text>
  </g>
  <g stroke="#111827" fill="none">
    <line x1="280" y1="100" x2="360" y2="110"/>
    <line x1="280" y1="130" x2="730" y2="120"/>
    <path d="M510 170 V210 H550 V240"/>
    <path d="M890 170 V210 H550 V240"/>
  </g>
</svg>
