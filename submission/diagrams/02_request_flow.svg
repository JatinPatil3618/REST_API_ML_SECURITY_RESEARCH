<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220">
  <rect width="1100" height="220" fill="#ffffff"/>
  <text x="24" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">HTTP request flow</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#111827"/></marker>
  </defs>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle">
    <rect x="16" y="70" width="120" height="64" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="76" y="98" font-weight="700">Request</text>
    <text x="76" y="116">with request id</text>
    <rect x="168" y="70" width="130" height="64" rx="6" fill="#f8fafc" stroke="#334155"/>
    <text x="233" y="98" font-weight="700">Identity</text>
    <text x="233" y="116">verified JWT only</text>
    <rect x="330" y="70" width="140" height="64" rx="6" fill="#fff7ed" stroke="#c2410c"/>
    <text x="400" y="98" font-weight="700">Features</text>
    <text x="400" y="116">ATRDF or BOLA</text>
    <rect x="502" y="70" width="130" height="64" rx="6" fill="#fff7ed" stroke="#c2410c"/>
    <text x="567" y="98" font-weight="700">ML service</text>
    <text x="567" y="116">port 8000</text>
    <rect x="664" y="70" width="150" height="64" rx="6" fill="#fefce8" stroke="#a16207"/>
    <text x="739" y="98" font-weight="700">Review rules</text>
    <text x="739" y="116">recorded separately</text>
    <rect x="846" y="70" width="120" height="64" rx="6" fill="#ecfdf5" stroke="#047857"/>
    <text x="906" y="98" font-weight="700">Decision</text>
    <text x="906" y="116">ALLOW/BLOCK/ALERT</text>
    <rect x="990" y="70" width="90" height="64" rx="6" fill="#f1f5f9" stroke="#475569"/>
    <text x="1035" y="98" font-weight="700">Record</text>
    <text x="1035" y="116">telemetry</text>
  </g>
  <g stroke="#111827" fill="none" marker-end="url(#a)">
    <line x1="136" y1="102" x2="168" y2="102"/>
    <line x1="298" y1="102" x2="330" y2="102"/>
    <line x1="470" y1="102" x2="502" y2="102"/>
    <line x1="632" y1="102" x2="664" y2="102"/>
    <line x1="814" y1="102" x2="846" y2="102"/>
    <line x1="966" y1="102" x2="990" y2="102"/>
  </g>
  <text x="24" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">An ATRDF block returns before the demo API. A deferred BOLA alert is forwarded, and backendReached becomes true only after the demo API returns a status.</text>
  <text x="24" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">Correlation headers X-Experiment-Id, X-Test-Case-Id, and X-Ground-Truth are excluded from the header count.</text>
</svg>
